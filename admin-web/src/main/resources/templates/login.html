<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login</title>
  <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>
<main class="login-page">
  <section class="card login-card">
    <h1>BusBooking Admin</h1>
    <p class="muted-text">Dang nhap bang email admin hoac so dien thoai co role ADMIN.</p>
    <p class="error" th:if="${param.error}">Thong tin dang nhap khong hop le hoac tai khoan khong phai admin.</p>
    <p class="error" th:if="${param.forbidden}">Phien dang nhap het han hoac khong du quyen. Vui long dang nhap lai.</p>
    <p class="muted-text" th:if="${param.logout}">Da dang xuat.</p>
    <form th:action="@{/login}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <div class="field">
        <label>Email hoac so dien thoai</label>
        <input type="text" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>
      <button class="btn" type="submit">Dang nhap</button>
    </form>
  </section>
</main>
</body>
</html>
