<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div th:replace="~{fragments/layout :: shell(~{::section})}">
  <section>
    <p><a class="btn" th:href="@{/buses/new}">Create bus</a></p>
    <p class="error" th:if="${loadError}" th:text="${loadError}">Could not load buses</p>
    <div class="table-card">
      <table>
        <thead><tr><th>ID</th><th>Name</th><th>Plate</th><th>Seats</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>
        <tr th:each="bus : ${buses}">
          <td th:text="${bus.id}">1</td>
          <td th:text="${bus.busName}">Bus</td>
          <td th:text="${bus.licensePlate}">Plate</td>
          <td th:text="${bus.totalSeats}">0</td>
          <td th:text="${bus.isActive} ? 'Active' : 'Inactive'">Active</td>
          <td class="actions">
            <span class="muted-text" th:if="${demoMode}">Demo</span>
            <a class="btn muted" th:unless="${demoMode}" th:href="@{/buses/{id}/edit(id=${bus.documentId})}">Edit</a>
            <a class="btn secondary" th:unless="${demoMode}" th:href="@{/buses/{id}/seats(id=${bus.documentId})}">Seats</a>
            <form th:if="${!demoMode and bus.isActive}" th:action="@{/buses/{id}/active/false(id=${bus.documentId})}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <button class="btn warning" type="submit">Disable</button>
            </form>
            <form th:if="${!demoMode and !bus.isActive}" th:action="@{/buses/{id}/active/true(id=${bus.documentId})}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <button class="btn secondary" type="submit">Enable</button>
            </form>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </section>
</div>
</body>
</html>
