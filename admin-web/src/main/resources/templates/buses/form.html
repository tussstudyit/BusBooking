<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div th:replace="~{fragments/layout :: shell(~{::section})}">
  <section class="card form">
    <form th:object="${busForm}" th:action="${mode == 'edit'} ? @{/buses/{id}(id=${documentId})} : @{/buses}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <div class="field"><label>Name</label><input th:field="*{busName}" required></div>
      <div class="field"><label>License plate</label><input th:field="*{licensePlate}" required></div>
      <div class="field"><label>Total seats</label><input type="number" min="1" max="80" th:field="*{totalSeats}" required></div>
      <div class="field"><label><input type="checkbox" th:field="*{isActive}"> Active</label></div>
      <button class="btn" type="submit">Save</button>
      <a class="btn muted" th:href="@{/buses}">Cancel</a>
    </form>
  </section>
</div>
</body>
</html>
