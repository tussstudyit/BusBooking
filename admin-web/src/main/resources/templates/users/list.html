<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div th:replace="~{fragments/layout :: shell(~{::section})}">
  <section>
    <form th:action="@{/users}" method="get" style="margin-bottom: 16px;">
      <input name="q" th:value="${q}" placeholder="Search name, email, phone">
    </form>
    <p class="error" th:if="${loadError}" th:text="${loadError}">Could not load users</p>
    <div class="table-card">
      <table>
        <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>
        <tr th:each="user : ${users}">
          <td th:text="${user.name}">Name</td>
          <td th:text="${user.email}">email</td>
          <td th:text="${user.phone}">phone</td>
          <td th:text="${user.role}">USER</td>
          <td th:text="${user.isBlocked} ? 'Blocked' : 'Active'">Active</td>
          <td class="actions">
            <form th:if="${!user.isBlocked}" th:action="@{/users/{uid}/blocked/true(uid=${user.uid})}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <button class="btn warning" type="submit">Block</button>
            </form>
            <form th:if="${user.isBlocked}" th:action="@{/users/{uid}/blocked/false(uid=${user.uid})}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <button class="btn secondary" type="submit">Unblock</button>
            </form>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </section>
</div>
</body>
</html>
