<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div th:replace="~{fragments/layout :: shell(~{::section})}">
  <section class="card form">
    <form th:object="${tripForm}" th:action="${mode == 'edit'} ? @{/trips/{id}(id=${documentId})} : @{/trips}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <div class="field">
        <label>Route</label>
        <select id="routeId" th:field="*{routeId}" required>
          <option value="">Select route</option>
          <option th:each="route : ${routes}"
                  th:value="${route.id}"
                  th:attr="data-price=${route.suggestedPrice},data-duration=${route.durationMs}"
                  th:text="${route.origin + ' -> ' + route.destination + (route.suggestedPrice == null ? '' : ' | ' + route.suggestedPrice + ' VND')}"></option>
        </select>
      </div>
      <div class="field">
        <label>Bus</label>
        <select th:field="*{busId}" required>
          <option value="">Select bus</option>
          <option th:each="bus : ${buses}" th:value="${bus.id}" th:text="${bus.busName} + ' - ' + ${bus.licensePlate}"></option>
        </select>
      </div>
      <input type="hidden" th:field="*{tripDate}">
      <input type="hidden" th:field="*{departureTime}">
      <input type="hidden" th:field="*{arrivalTime}">
      <div class="field">
        <label>Departure time</label>
        <input id="departureLocal" type="datetime-local" required>
        <p id="arrivalPreview" class="muted-text"></p>
      </div>
      <div class="field"><label>Price</label><input type="number" min="1" step="1000" th:field="*{price}" required></div>
      <div class="field">
        <label>Status</label>
        <select th:field="*{status}">
          <option value="SCHEDULED">SCHEDULED</option>
          <option value="DEPARTED">DEPARTED</option>
          <option value="COMPLETED">COMPLETED</option>
          <option value="CANCELLED">CANCELLED</option>
        </select>
      </div>
      <button class="btn" type="submit">Save</button>
      <a class="btn muted" th:href="@{/trips}">Cancel</a>
    </form>
  </section>
  <section class="card trip-seat-panel" th:if="${mode == 'edit'}">
    <div class="seat-panel-header">
      <div>
        <h2>Seat status</h2>
        <p class="muted-text" th:text="${trip.routeLabel + ' | ' + trip.busLicensePlate}">Route | bus</p>
      </div>
      <div class="seat-legend">
        <span><i class="seat-dot available"></i>Available</span>
        <span><i class="seat-dot booked"></i>Booked</span>
      </div>
    </div>
    <div class="seat-floors">
      <div class="seat-floor">
        <h3>Floor 1</h3>
        <div class="seat-grid">
          <th:block th:each="seat : ${seatViews}" th:if="${seat.floor == 1}">
            <div th:class="'admin-seat ' + ${seat.cssClass()}" th:title="${seat.status}">
              <span class="seat-icon"></span>
              <strong th:text="${seat.seatNumber}">A01</strong>
            </div>
          </th:block>
        </div>
      </div>
      <div class="seat-floor">
        <h3>Floor 2</h3>
        <div class="seat-grid">
          <th:block th:each="seat : ${seatViews}" th:if="${seat.floor == 2}">
            <div th:class="'admin-seat ' + ${seat.cssClass()}" th:title="${seat.status}">
              <span class="seat-icon"></span>
              <strong th:text="${seat.seatNumber}">B01</strong>
            </div>
          </th:block>
        </div>
      </div>
    </div>
  </section>
</div>
<script>
  const routeSelect = document.getElementById('routeId');
  const departureLocal = document.getElementById('departureLocal');
  const tripDate = document.getElementById('tripDate');
  const departureTime = document.getElementById('departureTime');
  const arrivalTime = document.getElementById('arrivalTime');
  const price = document.getElementById('price');
  const arrivalPreview = document.getElementById('arrivalPreview');

  function toLocalInputValue(ms) {
    const date = new Date(Number(ms));
    date.setMinutes(date.getMinutes() - date.getTimezoneOffset());
    return date.toISOString().slice(0, 16);
  }

  function formatLocal(ms) {
    return new Intl.DateTimeFormat('vi-VN', {
      dateStyle: 'short',
      timeStyle: 'short'
    }).format(new Date(Number(ms)));
  }

  function selectedRouteOption() {
    return routeSelect.options[routeSelect.selectedIndex];
  }

  function syncTripFields(allowPriceOverwrite = false) {
    const option = selectedRouteOption();
    if (option && option.dataset.price && (allowPriceOverwrite || !price.value)) {
      price.value = option.dataset.price;
    }
    if (!departureLocal.value) {
      return;
    }
    const departMs = new Date(departureLocal.value).getTime();
    const day = new Date(departMs);
    day.setHours(0, 0, 0, 0);
    const durationMs = option && option.dataset.duration ? Number(option.dataset.duration) : 4 * 3600 * 1000;
    tripDate.value = day.getTime();
    departureTime.value = departMs;
    arrivalTime.value = departMs + durationMs;
    arrivalPreview.textContent = 'Arrival: ' + formatLocal(arrivalTime.value);
  }

  if (departureTime.value) {
    departureLocal.value = toLocalInputValue(departureTime.value);
  } else {
    const nextHour = new Date();
    nextHour.setDate(nextHour.getDate() + 1);
    nextHour.setHours(8, 0, 0, 0);
    departureLocal.value = toLocalInputValue(nextHour.getTime());
  }

  routeSelect.addEventListener('change', () => syncTripFields(true));
  departureLocal.addEventListener('change', () => syncTripFields(false));
  syncTripFields(false);
</script>
</body>
</html>
