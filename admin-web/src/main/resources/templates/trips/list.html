<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div th:replace="~{fragments/layout :: shell(~{::section})}">
  <section>
    <p><a class="btn" th:href="@{/trips/new}">Create trip</a></p>
    <p class="error" th:if="${loadError}" th:text="${loadError}">Could not load trips</p>
    <p class="muted-text" th:unless="${loadError}">Hiển thị tối đa 80 chuyến sắp tới để giảm read Firestore.</p>
    <div class="table-card">
      <table>
        <thead><tr><th>ID</th><th>Route</th><th>Bus</th><th>Date</th><th>Depart</th><th>Price</th><th>Seats</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>
        <tr th:each="trip : ${trips}">
          <td th:text="${trip.id}">1</td>
          <td th:text="${trip.routeLabel}">Route</td>
          <td th:text="${trip.busLicensePlate}">43A-12345</td>
          <td th:text="${trip.tripDate}">0</td>
          <td th:text="${trip.departureTime}">0</td>
          <td th:text="${trip.price}">0</td>
          <td th:text="${trip.availableSeats + '/' + trip.totalSeats}">0/0</td>
          <td th:text="${trip.bookingStatus}">SCHEDULED</td>
          <td class="actions">
            <span class="muted-text" th:if="${demoMode}">Demo</span>
            <a class="btn muted" th:unless="${demoMode}" th:href="@{/trips/{id}/edit(id=${trip.documentId})}">Edit</a>
            <form th:if="${!demoMode and trip.status != 'CANCELLED'}" th:action="@{/trips/{id}/cancel(id=${trip.documentId})}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <button class="btn warning" type="submit">Cancel</button>
            </form>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </section>
</div>
</body>
</html>
