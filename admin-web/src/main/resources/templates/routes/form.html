<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div th:replace="~{fragments/layout :: shell(~{::section})}">
  <section class="card form">
    <form th:object="${routeForm}" th:action="${mode == 'edit'} ? @{/routes/{id}(id=${documentId})} : @{/routes}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <div class="field">
        <label>Origin</label>
        <select th:field="*{originId}" required>
          <option value="">Select origin</option>
          <option th:each="province : ${provinces}" th:value="${province.id}" th:text="${province.name}"></option>
        </select>
      </div>
      <div class="field">
        <label>Destination</label>
        <select th:field="*{destinationId}" required>
          <option value="">Select destination</option>
          <option th:each="province : ${provinces}" th:value="${province.id}" th:text="${province.name}"></option>
        </select>
      </div>
      <div class="field"><label>Distance km</label><input type="number" min="1" th:field="*{distance}" required></div>
      <div class="field"><label><input type="checkbox" th:field="*{isActive}"> Active</label></div>
      <button class="btn" type="submit">Save</button>
      <a class="btn muted" th:href="@{/routes}">Cancel</a>
    </form>
  </section>
</div>
</body>
</html>
