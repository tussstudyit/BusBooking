<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div th:replace="~{fragments/layout :: shell(~{::section})}">
  <section>
    <p><a class="btn" th:href="@{/routes/new}">Create route</a></p>
    <p class="error" th:if="${loadError}" th:text="${loadError}">Could not load routes</p>
    <div class="table-card">
      <table>
        <thead><tr><th>ID</th><th>Origin</th><th>Destination</th><th>Distance</th><th>Price</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>
        <tr th:each="route : ${routes}">
          <td th:text="${route.id}">1</td>
          <td th:text="${route.origin}">Origin</td>
          <td th:text="${route.destination}">Destination</td>
          <td th:text="${route.distance}">0</td>
          <td th:text="${route.suggestedPrice == null ? '-' : route.suggestedPrice}">0</td>
          <td th:text="${route.isActive} ? 'Active' : 'Inactive'">Active</td>
          <td class="actions">
            <span class="muted-text" th:if="${demoMode}">Demo</span>
            <a class="btn muted" th:unless="${demoMode}" th:href="@{/routes/{id}/edit(id=${route.documentId})}">Edit</a>
            <form th:if="${!demoMode and route.isActive}" th:action="@{/routes/{id}/active/false(id=${route.documentId})}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <button class="btn warning" type="submit">Disable</button>
            </form>
            <form th:if="${!demoMode and !route.isActive}" th:action="@{/routes/{id}/active/true(id=${route.documentId})}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
              <button class="btn secondary" type="submit">Enable</button>
            </form>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </section>
</div>
</body>
</html>
