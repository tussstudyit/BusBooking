<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="shell(content)">
  <div class="app">
    <aside class="sidebar">
      <div class="brand">BusBooking Admin</div>
      <nav class="nav">
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:href="@{/routes}">Routes</a>
        <a th:href="@{/buses}">Buses</a>
        <a th:href="@{/trips}">Trips</a>
        <a th:href="@{/users}">Users</a>
        <a th:href="@{/tickets}">Tickets</a>
        <a th:href="@{/payments}">Payments</a>
      </nav>
      <form class="logout" th:action="@{/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit">Logout</button>
      </form>
    </aside>
    <main class="main">
      <div class="topbar">
        <h1 th:text="${pageTitle ?: 'Admin'}">Admin</h1>
      </div>
      <th:block th:replace="${content}"></th:block>
    </main>
  </div>
</div>
</body>
</html>
