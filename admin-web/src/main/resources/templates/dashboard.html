<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div th:replace="~{fragments/layout :: shell(~{::section})}">
  <section>
    <div class="stats">
      <div class="card stat"><span>Users</span><strong th:text="${stats.users}">0</strong></div>
      <div class="card stat"><span>Active routes</span><strong th:text="${stats.activeRoutes}">0</strong></div>
      <div class="card stat"><span>Active buses</span><strong th:text="${stats.activeBuses}">0</strong></div>
      <div class="card stat"><span>Scheduled trips</span><strong th:text="${stats.scheduledTrips}">0</strong></div>
      <div class="card stat"><span>Tickets</span><strong th:text="${stats.tickets}">0</strong></div>
      <div class="card stat"><span>Successful payments</span><strong th:text="${stats.successfulPayments}">0</strong></div>
    </div>
  </section>
</div>
</body>
</html>
